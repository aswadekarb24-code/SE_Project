name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra gateway

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Unit tests with coverage
        run: uv run pytest tests/unit --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra gateway

      - name: Start gateway + postgres
        run: docker compose up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "gateway did not become healthy" && exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration -q

      - name: Tear down
        if: always()
        run: docker compose down -v
