name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-unit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # PyQt6 needs these system Qt/EGL/GLib/DBus libraries to even import,
      # including under QT_QPA_PLATFORM=offscreen (tests/conftest.py) --
      # they aren't bundled in the PyQt6 wheels since they're expected to be
      # system-provided, and bare Ubuntu runners don't have them installed.
      # This exact list was verified with `ldd` against the actual Qt6
      # shared libraries (libQt6Core/Gui/Widgets/DBus.so + the offscreen
      # platform plugin) on a clean ubuntu:24.04 container, then confirmed
      # by actually instantiating QApplication -- not guessed.
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra gateway

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Unit tests with coverage
        run: uv run pytest tests/unit --cov --cov-report=term-missing

  integration:
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4

      # Same as lint-and-unit: PyQt6 is imported at test-collection time
      # (tests/conftest.py) even for tests/integration, which doesn't touch
      # the UI itself. See that job's step for how this list was verified.
      - name: Install Qt system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libglib2.0-0 libdbus-1-3

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --extra dev --extra gateway

      - name: Start gateway + postgres
        run: docker compose up -d --build

      - name: Wait for gateway health
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          echo "gateway did not become healthy" && exit 1

      - name: Run integration tests
        run: uv run pytest tests/integration -q

      - name: Tear down
        if: always()
        run: docker compose down -v
