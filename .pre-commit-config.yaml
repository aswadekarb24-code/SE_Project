repos:
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (unit tests only)
        entry: uv run pytest tests/unit -q
        language: system
        pass_filenames: false
        always_run: true
